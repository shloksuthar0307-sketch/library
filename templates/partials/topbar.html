<!-- Premium Topbar -->
<header class="h-[var(--topbar-height)] border-b border-[var(--color-border)] bg-[var(--color-surface)]/80 backdrop-blur-md sticky top-0 z-30 flex items-center justify-between px-6 transition-colors duration-300">
    
    <!-- Left: Title & Sidebar Toggle (Mobile) -->
    <div class="flex items-center gap-4">
        <button id="sidebar-toggle" class="lg:hidden text-[var(--color-muted)] hover:text-[var(--color-text)] transition-colors">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div class="text-sm font-medium text-[var(--color-muted)] hidden sm:block">
            {% block breadcrumbs %}
                Welcome back, {{ user.get_full_name|default:user.username }}
            {% endblock %}
        </div>
    </div>

    <!-- Center: Global Search (Command Palette Trigger) -->
    <div class="flex-1 max-w-xl px-4 hidden md:block">
        <button class="cmd-k-trigger w-full flex items-center justify-between bg-[var(--color-surface-2)] border border-[var(--color-border)] hover:border-[var(--color-border-hover)] rounded-full px-4 py-2 text-sm text-[var(--color-muted)] transition-all">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[18px]">search</span>
                <span>Search books, members, transactions...</span>
            </div>
            <div class="flex items-center gap-1 opacity-70">
                <kbd class="font-mono bg-[var(--color-bg)] border border-[var(--color-border)] rounded px-1.5 py-0.5 text-xs">Ctrl</kbd>
                <kbd class="font-mono bg-[var(--color-bg)] border border-[var(--color-border)] rounded px-1.5 py-0.5 text-xs">K</kbd>
            </div>
        </button>
    </div>

    <!-- Right: Actions -->
    <div class="flex items-center gap-4">
        
        <!-- Theme Toggle -->
        <button class="theme-toggle text-[var(--color-muted)] hover:text-[var(--color-text)] transition-colors w-9 h-9 flex items-center justify-center rounded-full hover:bg-[var(--color-surface-hover)]">
            <span class="material-symbols-outlined text-[20px] dark:hidden">light_mode</span>
            <span class="material-symbols-outlined text-[20px] hidden dark:block">dark_mode</span>
        </button>

        <!-- Notification Bell -->
        <a href="{% url 'notifications:list' %}" class="relative text-[var(--color-muted)] hover:text-[var(--color-text)] transition-colors w-9 h-9 flex items-center justify-center rounded-full hover:bg-[var(--color-surface-hover)]">
            <span class="material-symbols-outlined text-[20px]">notifications</span>
            <span class="absolute top-2 right-2 w-2 h-2 bg-[var(--color-primary)] rounded-full animate-pulse shadow-[0_0_8px_var(--color-primary)]"></span>
        </a>

        <!-- Quick AI Search -->
        <button class="cmd-k-trigger btn btn-primary rounded-full hidden sm:flex">
            <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
            <span>Ask AI</span>
        </button>
    </div>
</header>
