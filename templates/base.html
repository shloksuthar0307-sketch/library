<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LIBRIX - Library Management System{% endblock %}</title>
    
    <!-- Premium Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Minimalist SaaS Theme Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#F8F8F6',
                        surface: '#FFFFFF',
                        primary: '{{ brand_primary|default:"#111111" }}',
                        secondary: '#6B7280',
                        muted: '#9CA3AF',
                        accent: '{{ brand_accent|default:"#10B981" }}',
                        'accent-hover': '#059669',
                        dark: '#2A2A2A',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F8F8F6;
            color: #111111;
            -webkit-font-smoothing: antialiased;
        }
        /* Hide scrollbar for clean minimal look */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #E5E7EB;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #D1D5DB;
        }
    </style>
</head>
<body class="bg-background text-accent h-screen w-full flex overflow-hidden">

    <!-- Sidebar Navigation -->
    {% include 'partials/sidebar.html' %}
    
    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Top Header -->
        {% include 'partials/topbar.html' %}
        
        <!-- Page Content -->
        <div class="flex-1 overflow-y-auto p-8">
            <div class="max-w-7xl mx-auto">
                {% if messages %}
                <div class="mb-6 space-y-2">
                    {% for message in messages %}
                    <div class="p-4 rounded-xl flex items-center gap-3 {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-100{% else %}bg-green-50 text-green-700 border border-green-100{% endif %} shadow-soft">
                        <span class="material-symbols-outlined text-xl">{% if message.tags == 'error' %}error{% else %}check_circle{% endif %}</span>
                        <span class="font-medium text-sm">{{ message }}</span>
                    </div>
                    {% endfor %}
                </div>
                {% endif %}
                
                {% block content %}
                {% endblock %}
            </div>
        </div>
    </main>

</body>
</html>
