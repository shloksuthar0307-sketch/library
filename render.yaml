databases:
  - name: library_db
    plan: free
    databaseName: library_db
    user: library_user

services:
  - type: web
    name: library-management
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: library_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "library-management.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://library-management.onrender.com"
      # Brevo SMTP Settings (Placeholder, fill in dashboard)
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  - type: redis
    name: library-redis
    plan: free

  - type: worker
    name: library-celery
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker -l info"
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: library-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: library-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: library_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "library-management.onrender.com"

  - type: worker
    name: library-celery-beat
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config beat -l info"
    envVars:
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: library-redis
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: library-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: library_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "library-management.onrender.com"
